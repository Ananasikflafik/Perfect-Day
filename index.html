<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Perfect Day</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ==== ГОЛОВНИЙ ЕКРАН ==== -->
    <div id="screen-main" class="screen">
      <header class="top-bar">
        <h1>🌤 Monkey Day</h1>
        <button id="open-maps-btn" class="icon-btn">🗺️ Maps</button>
      </header>

      <nav id="tabs">
        <button class="tab-btn active" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="shop">Shop</button>
      </nav>

      <main>
        <!-- ==== ВКЛАДКА "СЬОГОДНІ" ==== -->
        <section id="tab-today" class="tab active">
          <div id="pet-area">
            <div id="coin-counter">🍌<span id="coin-count">0</span></div>
            <div id="pet-mood"></div>
            <div id="pet-display">
              <span id="pet-emoji"></span>
              <span id="pet-skin"></span>
            </div>
            <div id="pet-name" class="editable"></div>
          </div>

          <h2>Завдання</h2>
          <div id="task-list"></div>

          <form id="add-task-form">
            <input
              type="text"
              id="new-task-name"
              placeholder="Name card"
              required
            />
            <span id="custom-task-price">🍌 +5</span>
            <button type="submit">+ Add</button>
          </form>
        </section>

        <!-- ==== ВКЛАДКА "МАГАЗИН" ==== -->
        <section id="tab-shop" class="tab">
          <h2>Skins</h2>
          <div id="shop-skins" class="shop-grid"></div>
        </section>
      </main>
    </div>

    <!-- ==== ЕКРАН МАП ==== -->
    <div id="screen-maps" class="screen hidden">
      <header class="top-bar">
        <h1>🗺️ Maps</h1>
        <button id="home-btn" class="icon-btn">🏠 Home</button>
      </header>
      <div id="maps-grid" class="maps-grid"></div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Perfect Day</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ==== ГОЛОВНИЙ ЕКРАН ==== -->
    <div id="screen-main" class="screen">
      <header class="top-bar">
        <h1>🌤 Perfect Day</h1>
        <button id="open-maps-btn" class="icon-btn">🗺️ Maps</button>
        <div class="top-bar">
          <button id="journalBtn" class="icon-btn">📖 Journal</button>
        </div>
      </header>

      <nav id="tabs">
        <button class="tab-btn active" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="shop">Shop</button>
      </nav>

      <main>
        <!-- ==== ВКЛАДКА "СЬОГОДНІ" ==== -->
        <section id="tab-today" class="tab active">
          <div id="pet-area">
            <div id="coin-counter">🍌<span id="coin-count">0</span></div>
            <div id="pet-display">
              <span id="pet-emoji"></span>
              <span id="pet-skin"></span>
            </div>
            <div id="pet-name" class="editable"></div>
          </div>

          <div class="task-list-header">
            <h2>Tasks</h2>
            <span id="task-count"></span>
          </div>

          <div id="task-list"></div>
          <button id="toggle-tasks-btn" class="toggle-btn hidden"></button>

          <form id="add-task-form">
            <input
              type="text"
              id="new-task-name"
              placeholder="Name card"
              required
            />
            <span id="custom-task-price">🍌 +5</span>
            <button type="submit">+ Add</button>
          </form>
          <div id="task-limit-msg" class="limit-msg hidden"></div>
        </section>

        <!-- ==== ВКЛАДКА "МАГАЗИН" ==== -->
        <section id="tab-shop" class="tab">
          <h2>Skins</h2>
          <div id="shop-skins" class="shop-grid"></div>
        </section>
      </main>
    </div>

    <!-- ==== ЕКРАН МАП ==== -->
    <div id="screen-maps" class="screen hidden">
      <header class="top-bar">
        <h1>🗺️ Maps</h1>
        <button id="home-btn" class="icon-btn">🏠 Home</button>
      </header>
      <div id="maps-grid" class="maps-grid"></div>
    </div>
    <div class="journal" id="journalSection">
      <h1>🐒 Monkey's Journal</h1>

      <p class="subtitle">swinging through thoughts, one banana at a time 🍌</p>

      <div class="card">
        <input
          type="text"
          id="entryTitle"
          placeholder="Give today a jungle title... 🌴"
        />

        <div class="moods" id="moodPicker">
          <button class="mood" data-mood="🐵">🐵</button>

          <button class="mood" data-mood="😢">😢</button>

          <button class="mood" data-mood="😴">😴</button>

          <button class="mood" data-mood="🥰">🥰</button>

          <button class="mood" data-mood="😤">😤</button>

          <button class="mood" data-mood="🤔">🤔</button>

          <button class="mood" data-mood="🎉">🎉</button>
        </div>

        <textarea
          id="entryText"
          placeholder="Dear jungle diary, today I..."
        ></textarea>

        <button class="save-btn" id="saveBtn">🍌 Save Entry</button>
      </div>

      <div class="entries">
        <h2>🌿 Past Entries</h2>

        <div id="entriesList"></div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script scr="script.js"></script>
  </body>
</html>
